<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 236" width="680" height="236" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <style>
    .lane { font-size: 10.5px; font-weight: 600; fill: #0b0b0b; }
    .ph { font-size: 10.5px; font-weight: 700; fill: #0b0b0b; }
    .sub { font-size: 8.6px; fill: #52514e; }
    .lbl { font-size: 8.4px; fill: #52514e; }
    .ln { stroke: #d9d8d3; stroke-width: 1; }
  </style>
  <!-- phase headers -->
  <g>
    <rect x="70" y="6" width="96" height="36" rx="4" fill="#f1f0ec"/>
    <text x="118" y="21" text-anchor="middle" class="ph">0 · Discovery</text>
    <text x="118" y="34" text-anchor="middle" class="sub">beacons, implicit leader</text>
    <rect x="172" y="6" width="190" height="36" rx="4" fill="#e3edf9"/>
    <text x="267" y="21" text-anchor="middle" class="ph">1 · Broadcast reconciliation</text>
    <text x="267" y="34" text-anchor="middle" class="sub">RIBLT stream, batches + request windows</text>
    <rect x="368" y="6" width="120" height="36" rx="4" fill="#fbe7dc"/>
    <text x="428" y="21" text-anchor="middle" class="ph">U · Upload</text>
    <text x="428" y="34" text-anchor="middle" class="sub">TDMA slots, overheard</text>
    <rect x="494" y="6" width="112" height="36" rx="4" fill="#e3edf9"/>
    <text x="550" y="21" text-anchor="middle" class="ph">2 · Catch-up</text>
    <text x="550" y="34" text-anchor="middle" class="sub">POLL; stream if needed</text>
    <rect x="612" y="6" width="64" height="36" rx="4" fill="#f1f0ec"/>
    <text x="644" y="21" text-anchor="middle" class="ph">Verify</text>
    <text x="644" y="34" text-anchor="middle" class="sub">fingerprints</text>
  </g>
  <!-- lanes -->
  <text x="6" y="74" class="lane">Leader L</text>
  <text x="6" y="124" class="lane">Node A</text>
  <text x="6" y="174" class="lane">Node B</text>
  <text x="6" y="218" class="lane">Node C</text>
  <line x1="68" y1="70" x2="676" y2="70" class="ln"/>
  <line x1="68" y1="120" x2="676" y2="120" class="ln"/>
  <line x1="68" y1="170" x2="676" y2="170" class="ln"/>
  <line x1="68" y1="214" x2="676" y2="214" class="ln"/>
  <!-- discovery beacons -->
  <g fill="#9a9993">
    <rect x="78" y="64" width="12" height="12" rx="2"/>
    <rect x="98" y="114" width="12" height="12" rx="2"/>
    <rect x="118" y="164" width="12" height="12" rx="2"/>
    <rect x="138" y="208" width="12" height="12" rx="2"/>
  </g>
  <!-- phase 1 stream frames -->
  <g fill="#2a78d6">
    <rect x="180" y="62" width="18" height="16" rx="2"/>
    <rect x="202" y="62" width="18" height="16" rx="2"/>
    <rect x="252" y="62" width="18" height="16" rx="2"/>
    <rect x="274" y="62" width="18" height="16" rx="2"/>
    <rect x="322" y="62" width="18" height="16" rx="2" fill="#6250d6"/>
    <rect x="344" y="62" width="14" height="16" rx="2"/>
  </g>
  <text x="189" y="58" text-anchor="middle" class="lbl">s0–3</text>
  <text x="211" y="58" text-anchor="middle" class="lbl">s4–7</text>
  <text x="331" y="58" text-anchor="middle" class="lbl">repair</text>
  <!-- broadcast arrows -->
  <path d="M211,78 L211,112" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M215,78 L215,162" stroke="#2a78d6" stroke-width="1.3" stroke-dasharray="3 2" marker-end="url(#ar)"/>
  <path d="M219,78 L219,206" stroke="#2a78d6" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="222" y="152" class="lbl">lost</text>
  <!-- request window -->
  <rect x="228" y="100" width="20" height="120" rx="3" fill="none" stroke="#9a9993" stroke-dasharray="2 2"/>
  <rect x="232" y="164" width="12" height="12" rx="2" fill="#eb6834"/>
  <text x="238" y="234" text-anchor="middle" class="lbl">REQ + NACK</text>
  <path d="M238,164 C238,120 238,95 236,80" stroke="#eb6834" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <!-- decoded markers -->
  <text x="276" y="128" class="lbl">✓ A decoded → sleeps</text>
  <text x="300" y="222" class="lbl">✓ C decoded</text>
  <text x="352" y="180" class="lbl" text-anchor="end">✓ B</text>
  <!-- upload -->
  <rect x="380" y="114" width="20" height="12" rx="2" fill="#eb6834"/>
  <rect x="430" y="208" width="20" height="12" rx="2" fill="#eb6834"/>
  <path d="M390,114 L390,80" stroke="#eb6834" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M440,208 L440,80" stroke="#eb6834" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M396,126 L396,162" stroke="#eb6834" stroke-width="1" stroke-dasharray="2 2" marker-end="url(#ar)"/>
  <rect x="404" y="64" width="10" height="12" rx="2" fill="#9a9993"/>
  <rect x="454" y="64" width="10" height="12" rx="2" fill="#9a9993"/>
  <text x="409" y="58" text-anchor="middle" class="lbl">ACK</text>
  <text x="402" y="150" class="lbl">overheard</text>
  <!-- phase 2 -->
  <rect x="502" y="62" width="20" height="16" rx="2" fill="#0b0b0b"/>
  <text x="512" y="58" text-anchor="middle" class="lbl">POLL</text>
  <text x="530" y="99" class="lbl">all match → skip</text>
  <!-- verify -->
  <g fill="#9a9993">
    <rect x="618" y="64" width="10" height="12" rx="2"/>
    <rect x="632" y="114" width="10" height="12" rx="2"/>
    <rect x="646" y="164" width="10" height="12" rx="2"/>
    <rect x="660" y="208" width="10" height="12" rx="2"/>
  </g>
</svg>
